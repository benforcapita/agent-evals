[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals"
version = "0.1.0"
description = "Evaluation runner, redaction scanner, and validation CLI for core shared skills"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "PyYAML>=6.0.1,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0",
  "ruff>=0.7.0,<1.0",
]

[project.scripts]
evals = "evals.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
